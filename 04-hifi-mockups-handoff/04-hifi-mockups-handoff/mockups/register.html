<style>

body{margin:0}*{box-sizing:border-box}
.r{font:400 15px/1.5 "DM Sans",sans-serif;color:#17263d;background:#f3f6fc}

.ch.on{background:#eaf1fb;color:#184b9e;border-color:#9bbbe8}.ch i{width:14px;height:14px;border-radius:4px;border:1.6px solid currentColor}.ch.on i{background:#2463c4;border-color:#2463c4}
.sb{width:240px;flex:none;background:#fff;border-right:1px solid #dbe4f0;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:600;color:#55657d}.nv i{width:18px;height:18px;border:1.8px solid currentColor;border-radius:5px}.nv.on{background:#2463c4;color:#fff}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{text-align:left;padding:13px 18px;font-size:12.5px;color:#55657d;background:#f6f8fc;border-bottom:1px solid #dbe4f0}.tb td{padding:13px 18px;border-bottom:1px solid #dbe4f0}

<div class="r" style="min-height:100vh;padding:40px;display:flex;justify-content:center;align-items:flex-start;background:#e9eff8"><div class="cd" style="width:500px;padding:36px;box-shadow:0 14px 38px rgba(23,38,61,.1);display:flex;flex-direction:column;gap:16px"><div><p class="lb" style="color:#2463c4">Hope team workspace</p><h2 class="s" style="font-size:34px;line-height:1.05;margin-top:8px">Create your account</h2><p class="m" style="font-size:14px;margin-top:8px">Register with your work email. An administrator will review your request.</p></div><div class="row" style="background:#edf2f8;padding:4px;border-radius:8px;gap:4px"><span class="bt sm" style="flex:1;background:transparent;color:#55657d">Sign in</span><span class="bt sm" style="flex:1;">Register</span></div><div><p class="lab">Full name</p><div class="in">Your name</div></div><div><p class="lab">Work email</p><div class="in">name@hope.com</div></div><div><p class="lab">Password</p><div class="in">At least 8 characters</div></div><p class="m" style="font-size:12.5px;margin-top:-8px">Use at least 8 characters.</p><button class="bt" style="width:100%">Create account</button></div></div>
